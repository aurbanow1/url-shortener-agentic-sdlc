schema: openrig.project/v0alpha1
kind: project
metadata:
  id: urlshort
install:
  intent: SPEC.md
  context:
    - AGENTS.md
  skills: []
missions:
  root: missions

# Attributed proof judgments: the QA Agent judges proof-contract items
# (rig proof judge); delivery stamps follow the human's ship sign-off.
proofPolicy:
  judges:
    - qa-agent@urlshort-factory

# Mission lifecycle: the mission-level dependency graph (pure depends_on DAG).
# Slices are NOT steps here — each slice runs as its own urlshort-slice workflow
# instance, launched and awaited by wave_integration (fan-out / fan-in). Every
# producing step is followed by an independent review before a human gate.
# Inspect with: rig workflow compile missions/<mission> --json
lifecycle:
  profile: urlshort-mission-v1
  profiles:
    urlshort-mission-v1:
      required_steps:
        - decompose
        - decomposition_review
        - mission_plan_lock
        - wave_integration
        - wave_review
        - release_prep
        - release_review
        - ship_signoff
        - evidence_export
        - mission_close
      workflow:
        entry: { role: planning }
        coordination_terminal_turn_rule: hot_potato
        exception_routing: { default: orchestrator, orchestrator_role: orchestrator }
        roles:
          planning:      { preferred_targets: [orchestration-lead@urlshort-factory] }
          orchestrator:  { preferred_targets: [orchestration-lead@urlshort-factory] }
          integrator:    { preferred_targets: [orchestration-lead@urlshort-factory] }
          wave_reviewer: { preferred_targets: [review-agent@urlshort-factory] }
          reviewer:      { preferred_targets: [review-agent@urlshort-factory] }
          release:       { preferred_targets: [release-agent@urlshort-factory] }
        steps:
          - id: decompose
            actor_role: planning
            depends_on: []
            objective: >-
              Decompose the mission intent into slices (one buildable user outcome
              each, disjoint file territories), record depends_on edges, the wave
              map and a gate tier per slice, scaffold slice.yaml files, and export
              the compiled graph to docs/evidence/<mission>/compiled-graph.json.
            allowed_exits: [handoff, waiting, failed]
          - id: decomposition_review
            actor_role: reviewer
            depends_on: [decompose]
            objective: >-
              Independent review of the decomposition before the human sees it:
              slices are single buildable outcomes with disjoint territories,
              dependencies and waves are consistent with the intent, gate tiers
              are justified, risks are named. Rework goes back to the planner by
              queue handoff while this step waits; a clean review hands off.
            allowed_exits: [handoff, waiting, failed]
          - id: mission_plan_lock
            actor_role: orchestrator
            depends_on: [decomposition_review]
            objective: >-
              Hold the decomposition at the human gate: slices, order, waves, gate
              tiers and risks as a decision brief. On approval record the mission
              plan-lock stamp on behalf of the human.
            allowed_exits: [handoff, waiting, failed]
            gate:
              target: human@kernel
              summary: "Mission decomposition ready — approve slices, waves and gate tiers (mission plan-lock)."
              evidence_ref: SPEC.md
          - id: wave_integration
            actor_role: integrator
            depends_on: [mission_plan_lock]
            objective: >-
              For each wave in order: instantiate one urlshort-slice workflow per
              slice (fan-out), wait on every slice's proof (fan-in), merge accepted
              candidates serially into main, roll back by revert when main goes red.
            allowed_exits: [handoff, waiting, failed]
          - id: wave_review
            actor_role: wave_reviewer
            depends_on: [wave_integration]
            objective: >-
              Review the accumulated wave range on main with two vantages (review
              agent + design agent, authors excluded): drift against the SPECs,
              structure, and claim-by-claim verification; dispose misses as
              CONTEXT-GAP or JUDGMENT-GAP.
            allowed_exits: [handoff, waiting, failed]
          - id: release_prep
            actor_role: release
            depends_on: [wave_review]
            objective: >-
              Prepare the release: build the jar and image, run the installed smoke
              journey, update README/TESTING, write RELEASE.md with evidence links
              and known gaps, export evidence and refresh metrics. Publish nothing.
            allowed_exits: [handoff, waiting, failed]
          - id: release_review
            actor_role: reviewer
            depends_on: [release_prep]
            objective: >-
              Independent review of the release package before the human ship
              gate: every claim in RELEASE.md traced to evidence (proof readiness,
              review verdicts, coverage, smoke), known gaps complete and honest,
              rollback path real. Rework goes back to the release agent by queue
              handoff while this step waits; a clean review hands off.
            allowed_exits: [handoff, waiting, failed]
          - id: ship_signoff
            actor_role: release
            depends_on: [release_review]
            objective: >-
              Hold the ship decision at the human gate against RELEASE.md. Approval
              records delivery stamps for the mission's slices; nothing is
              published by an agent.
            allowed_exits: [handoff, waiting, failed]
            gate:
              target: human@kernel
              summary: "Release candidate prepared and proven — sign off to ship (publishing stays a human act)."
              evidence_ref: RELEASE.md
          - id: evidence_export
            actor_role: release
            depends_on: [ship_signoff]
            objective: >-
              Export the complete audit trail for the mission (workflow traces,
              queue transitions, proof readiness, compiled graph, metrics) into
              docs/evidence/<mission>/ and commit it.
            allowed_exits: [handoff, waiting, failed]
          - id: mission_close
            actor_role: orchestrator
            depends_on: [evidence_export]
            objective: >-
              Close the mission: PROGRESS and NOTES current, worktrees removed,
              follow-on work recorded as backlog, final status to the human.
            allowed_exits: [done, waiting, failed]
