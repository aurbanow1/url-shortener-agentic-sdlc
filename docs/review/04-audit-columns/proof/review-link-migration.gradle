// Run from root: scripts/gw --log docs/review/04-audit-columns/proof/design-migration-check.txt --offline -I docs/review/04-audit-columns/proof/review-link-migration.gradle reviewLinkMigration
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.tasks.register('reviewLinkMigration', JavaExec) {
        dependsOn project.tasks.named('functionalTestClasses')
        javaLauncher.set(project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
        classpath = project.sourceSets.functionalTest.runtimeClasspath
        mainClass = project.file('docs/review/04-audit-columns/proof/ReviewLinkMigrationProbe.java').absolutePath
    }
}
