name: urlshort-requirements-agent
version: "1.0"
description: >-
  Requirements Agent: turns a slice intent into the one requirements authority
  (SPEC.md) with user stories, GIVEN/WHEN/THEN acceptance criteria, business
  rules, scope, an ambiguity log and a proof contract.

defaults:
  runtime: claude-code
  model: claude-opus-5-5

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [requirements-writer, context-builder, plan-review, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
