name: urlshort-review-agent
version: "1.0"
description: >-
  Review Agent (Codex, independent of the Claude builder) holding two roles:
  Code Review Agent (every changed file read, findings with severity and
  evidence, resolution ledger) and Security & Compliance Agent (shortener
  threat checklist, dependency check, verdict on the threat model); also the
  primary vantage in mission wave review.

defaults:
  runtime: codex

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [ponytail, ponytail-review, review-team, plan-review, systematic-debugging, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  skills:
    - id: ponytail
      path: skills/ponytail
    - id: ponytail-review
      path: skills/ponytail-review
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
