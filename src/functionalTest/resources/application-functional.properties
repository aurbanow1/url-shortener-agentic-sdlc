spring.datasource.url=jdbc:h2:mem:urlshort-functional;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# The suite sends hundreds of requests a minute from MockMvc's single 127.0.0.1, so the shipped
# budgets (60 and 600 per minute) would throttle unrelated journeys. The rate-limit journeys set the
# shipped numbers inline; RateLimitDefaultsTest proves the shipped file still carries them.
urlshort.rate-limit.create-per-minute=1000000
urlshort.rate-limit.redirect-per-minute=1000000
# A purge run writes an INFO line with no request id; the shared contexts' log-window journeys require
# every captured line to carry one (02-click-retention DR-01). The purge journeys turn it back on.
urlshort.click.purge-enabled=false
