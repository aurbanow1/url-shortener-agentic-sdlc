spring.application.name=urlshort

# Base of every shortUrl; override with URLSHORT_PUBLIC_BASE_URL. Never taken from Host headers.
urlshort.public-base-url=http://localhost:8080

# Per-client rate limit (NFR-R2): /api requests per minute, every other limited request per minute,
# and the proxies whose X-Forwarded-For is believed (exact addresses, comma-separated; none by default).
# Overridable by URLSHORT_RATELIMIT_CREATEPERMINUTE, _REDIRECTPERMINUTE, _TRUSTEDPROXIES.
urlshort.rate-limit.create-per-minute=60
urlshort.rate-limit.redirect-per-minute=600
urlshort.rate-limit.trusted-proxies=
# The audit read trusts only the connection address (ADR-0019); Tomcat must not rewrite it from
# X-Forwarded-For, which Boot otherwise enables on a detected cloud platform.
server.forward-headers-strategy=none

# Click retention (NFR-P2): clicks older than this many UTC days are deleted at startup and daily at 00:10Z; a positive whole number. Overridable by URLSHORT_CLICK_RETENTIONDAYS (ADR-0018).
urlshort.click.retention-days=90
# Hold: false pauses every deletion (startup and daily) and logs a WARN at start, e.g. while an incident is investigated or under a legal hold. Overridable by URLSHORT_CLICK_PURGEENABLED.
urlshort.click.purge-enabled=true

# Embedded H2 file database under ./data (zero ops); schema owned by Flyway.
spring.datasource.url=jdbc:h2:file:./data/urlshort;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true

# RFC 9457 problem details for every error; graceful shutdown for in-flight requests.
spring.mvc.problemdetails.enabled=true
# No multipart parsing anywhere: only JSON bodies are accepted (NFR-S3).
spring.servlet.multipart.enabled=false
# Initialise the DispatcherServlet at startup, so its log lines are not written inside the
# first request without that request's id (AC-26, ADR-0004).
spring.mvc.servlet.load-on-startup=1
# The 405 handler's WARN quotes the client's method token; this category logs nothing else (ADR-0004).
logging.level.org.springframework.web.servlet.PageNotFound=error
# Tomcat's first parse error per connector is logged at INFO with the offending request bytes, before
# any request id exists; MVC's resource handler WARNs the whole submitted path it refuses
# (e.g. /actuator/../<anything>). Both would put client values in the log (ADR-0004, A-17, DR-01).
logging.level.org.apache.coyote.http11.Http11Processor=warn
logging.level.org.springframework.web.servlet.resource.ResourceHandlerUtils=error
# NFR-R3: stop accepting, drain in-flight requests for at most 10 s (the container's stop grace is longer).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Structured JSON logs (one line per event, request id added via MDC).
logging.structured.format.console=ecs
logging.structured.json.exclude=process.thread.name

# Operational surface: health probes, metrics and the Prometheus scrape (NFR-R1, NFR-O3, ADR-0016).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# Readiness is UP only while the database answers; liveness never asks it (business rule 9).
management.endpoint.health.group.readiness.include=readinessState,db
# Status only: the probes are anonymous, details would name the database and its location (AC-15).
management.endpoint.health.show-details=never

# OpenAPI 3 document for the public API.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Each operation declares its own problem responses; do not derive untyped ones from the error advice.
springdoc.override-with-generic-response=false
# Key-sorted output, so the committed docs/api/openapi.json diffs cleanly (ADR-0010).
springdoc.writer-with-order-by-keys=true
