spring.application.name=urlshort

# Embedded H2 file database under ./data (zero ops); schema owned by Flyway.
spring.datasource.url=jdbc:h2:file:./data/urlshort;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true

# RFC 9457 problem details for every error; graceful shutdown for in-flight requests.
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Structured JSON logs (one line per event, request id added via MDC).
logging.structured.format.console=ecs
logging.structured.json.exclude=process.thread.name

# Operational surface: health probes and metrics only.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# OpenAPI 3 document for the public API.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
