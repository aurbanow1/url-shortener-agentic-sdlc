schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 02-analytics
# Gate tier decides the workflow variant: high -> urlshort-slice (human plan-lock),
# low -> urlshort-slice-delegated (orchestration lead approves the plan-lock).
tier: high
tier_reason: adds a schema migration (the click table; decomposition guide section 4 lists a migration as high) and decides privacy-sensitive storage under NFR-P1 (salted, daily-rotated hash of the client address, user-agent class, referrer host only). Additive on the foundation otherwise; no change to the link rows.
# Requirements allocated (docs/REQUIREMENTS.md): FR-7 FR-8; NFR-P1 L3; cross-cutting M1 M2 M3 O1 O2.
# Input carried from 00-hello: backlog 3 (W1-02): NFR-P1 constrains log content, so the design
# weighs one small real-server functional journey against test-context cost (MockMvc cannot see
# Tomcat thread metadata; only the live capture caught QA-01).
# Wave w2 with 03-operate: territories disjoint; the two shared-file grants below name the reason.
territory:
  - src/main/java/dev/urlshort/click/
  - src/test/java/dev/urlshort/click/
  - src/functionalTest/java/dev/urlshort/click/
  # V2 only (click table); the only wave-w2 slice that adds a migration.
  - src/main/resources/db/migration/
  # GRANT limited to the redirect hook: the one call or event that hands a redirect to the click
  # recorder. Reviewers check that the diff under link/ is that hook and nothing else.
  # Slice 03 does not touch link/.
  - src/main/java/dev/urlshort/link/
  # ORDERED GRANT for wave w2, first holder: adds the stats endpoint. 02 merges first in w2; from
  # its merge the grant passes to 03-operate, which regenerates the document on a base that
  # contains 02 to add the 429 contract (decomposition review DC-01; mission SPEC shaping rule 5).
  - docs/api/openapi.json
  - docs/diagrams/erd.mmd
execution:
  actor_role: requirements
  depends_on: [01-create-redirect]
