// Constraint probe for 02-analytics design review DR-04 (design.md section 12).
// Run from the repo root, no product, test or build file changes:
//   scripts/gw --log missions/01-greenfield-core/slices/02-analytics/design-probe/constraint-output.txt \
//       --offline -I missions/01-greenfield-core/slices/02-analytics/design-probe/constraint-probe.gradle designConstraintProbe
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def functional = project.sourceSets.functionalTest
    project.tasks.register('designConstraintProbe', JavaExec) {
        dependsOn project.tasks.named('functionalTestClasses')
        javaLauncher.set(project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
        classpath = functional.runtimeClasspath
        mainClass = project.file('missions/01-greenfield-core/slices/02-analytics/design-probe/ConstraintProbe.java').absolutePath
    }
}
