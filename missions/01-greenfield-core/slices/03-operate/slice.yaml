schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 03-operate
# Gate tier decides the workflow variant: high -> urlshort-slice (human plan-lock),
# low -> urlshort-slice-delegated (orchestration lead approves the plan-lock).
tier: low
tier_reason: delegated plan-lock by the human's fast-plan decision of 2026-10-03 (operator packet qitem-20261003052736-7830d02a; mission plan-lock re-approved, action 01M403RBRS6DQTXA1VW89AXQCA), which delegates every slice plan-lock after 01-create-redirect to the orchestration lead. The lead's own plan review weighs what guide section 4 would have called high, the rate limiter's trusted-proxy rule for X-Forwarded-For and the container privilege changes; the independent design and security reviews cover both. No migration.
# Requirements allocated (docs/REQUIREMENTS.md), in two groups so the SPEC does not promise
# proofs the suites cannot give:
#   builds and proves in-suite: FR-10, NFR-R2 (at the limit, one over, spoofed X-Forwarded-For),
#     R1 (readiness group includes the database), O3 (metric names and the rejection counter
#     readable through the actuator), and the 429 contract in the committed OpenAPI document
#     (M3 carried through FR-10: the 429 problem-detail response, the Retry-After header and
#     examples on every operation, verified against the integrated service's live /v3/api-docs);
#   owns the configuration / Dockerfile / compose / smoke lines, proof is release-level
#     (installed smoke, docker inspect, restart loop, bench): R3, R4, S5, X1, L1, L2.
#     What the slice cannot prove in-suite is recorded in docs/qa/GAPS.md, not claimed.
#   cross-cutting: M1 M2 M3.
# Wave w2 with 02-analytics: territories disjoint at any moment; the grants below name the reason.
# SERIALIZATION POINT (decomposition review DC-01): docs/api/openapi.json has one holder at a time.
# In w2 the grant is ordered: 02-analytics holds it until 02's merge into main; 03 holds it from
# then on. 02 merges at its own integrate step on its own three verdicts, without waiting for 03
# (the schedule is acyclic: merge 02, hand off 03, prove 03, merge 03); wave_integration launches
# w3 only when both slices are accepted (decomposition review DC-02).
# 03's implement step therefore hands off a candidate that descends from 02's merge
# commit, with the document regenerated on that base (so it carries 02's stats endpoint and 03's
# 429 response on every operation). If 03's build is otherwise done before 02 has merged, the
# builder exits waiting --blocked-on 02's frontier packet with the continuation "rebase onto
# main, regenerate docs/api/openapi.json, hand off". The integrator checks the ancestry
# (git merge-base --is-ancestor <02 merge commit> <03 candidate>) before merging 03; a candidate
# that predates 02's merge is routed back to implement, and the three reviews re-earn their
# verdict on the regenerated diff in one short turn each. 04-audit-read moved to mission 02 by the
# fast plan; w2 is the last wave of this mission and hands off to wave_review when both are accepted.
# Launch note (fast plan item 4): instantiate this slice with the second-judge workflow variant
# (second reviewer and QA seats) once the operator has added it under rig/workflows/, so 02 and 03
# do not queue on one judge; fall back to urlshort-slice-delegated if the variant is not there.
territory:
  # the rate-limit filter lives beside the request-id filter (cross-cutting HTTP concerns).
  - src/main/java/dev/urlshort/web/
  - src/test/java/dev/urlshort/web/
  - src/functionalTest/java/dev/urlshort/web/
  # GRANT for wave w2: readiness group, actuator exposure, rate-limit defaults. Slice 02 does not touch it.
  - src/main/resources/application.properties
  # GRANT for wave w2: the Micrometer Prometheus registry only. Slice 02 does not touch it.
  - build.gradle.kts
  - Dockerfile
  - compose.yaml
  # --bench mode for NFR-L1/L2; restart loop for R3/R4.
  - scripts/smoke.sh
  # ORDERED GRANT for wave w2, second holder after 02's merge: the 429 problem-detail response with
  # the Retry-After header and examples on every operation, regenerated on a base that contains 02.
  - docs/api/openapi.json
# NOT in territory: link/, click/, db/migration/.
execution:
  actor_role: requirements
  depends_on: [01-create-redirect]
