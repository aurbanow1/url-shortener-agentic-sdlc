schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 04-audit-read
# Gate tier decides the workflow variant: high -> urlshort-slice (human plan-lock),
# low -> urlshort-slice-delegated (orchestration lead approves the plan-lock).
tier: high
tier_reason: new security-relevant surface, a read endpoint over the audit trail (request ids, before/after payloads of every mutation) that must be loopback-only by default (NFR-S6, an assumed row confirmed at the mission plan-lock); decomposition guide section 4 names audit read as high. No migration; reads the audit_log table from slice 01.
# Requirements allocated (docs/REQUIREMENTS.md): FR-17; NFR-S6; cross-cutting M1 M2 M3 O1 O2.
# Hard edge: 01-create-redirect (the audit_log table and its row shape).
# SOFT-AFTER: [02-analytics, 03-operate] — the shared-file grants this slice needs
# (docs/api/openapi.json, application.properties) are held by 02 and 03 in wave w2, so 04 runs
# alone in wave w3; a third contract-changing slice in w2 would also exceed one reviewer's capacity.
territory:
  # read side: the query and endpoint over audit_log; the write side from slice 01 is on main by w3.
  - src/main/java/dev/urlshort/audit/
  - src/test/java/dev/urlshort/audit/
  - src/functionalTest/java/dev/urlshort/audit/
  # GRANT for wave w3 (alone): the audit endpoint if the design exposes it as a public API path.
  - docs/api/openapi.json
  # GRANT for wave w3 (alone): management address/port if the design exposes the audit read as an
  # actuator endpoint bound to loopback instead of a public API path. The design chooses; both
  # options keep the loopback-only default testable by effect against a non-loopback bind.
  - src/main/resources/application.properties
execution:
  actor_role: requirements
  depends_on: [01-create-redirect]
