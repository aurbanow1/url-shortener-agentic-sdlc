schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 04-audit-columns
# Gate tier decides the workflow variant: high -> urlshort-slice, low -> urlshort-slice-delegated.
# Since D11 both route the slice plan-lock to the orchestration lead.
tier: low
tier_reason: delegated plan-lock (D11). One expand migration with a written rollback and the repository code that maintains the new columns; no endpoint, contract or behaviour change for clients. The lead's plan review weighs what decomposition guide section 4 calls high, a schema change on shipped tables, and the independent design and security reviews cover it.
# ORIGIN: human decision of 2026-10-03, relayed by the operator on qitem-20261003175330-fb054f2f:
# every table carries audit columns (created_at, updated_at, and created_by/updated_by where an
# actor exists); docs/guidance/databases.md section 2 and the section 8 review check. The human's
# text lets the lead place link/audit_log/user_agent_class "under whichever mission-02 slice you
# choose or a tiny follow-on slice". This is that follow-on slice, for link and audit_log only:
# user_agent_class is created in V2 with click and lives in click/, so 02-click-retention's expand
# migration covers it together with click.
# Requirements allocated: the audit-column policy (databases.md section 2) for link and audit_log;
# NFR-X2 (versioned migration with a written rollback); FR-13 (existing links behave exactly as
# before); NFR-A2 (audit_log stays append-only: no update path is added, and updated_at equals
# created_at for every audit row); cross-cutting M1 M2.
# BROWNFIELD: design writes impact-analysis.md over link/ and audit/ (V1, the repositories, the
# audit writer) before design.md, including the backfill of existing rows.
# WAVE w2, alongside 03-dogfood-fix (dogfood touches web/ and docs/api/openapi.json; this touches
# link/, audit/ and db/migration; disjoint). It runs after both w1 slices are merged and takes the
# next free Flyway number after 02-click-retention's V3. Mission 03's 01-analytics-v2 also uses the
# migration sequence; its plan-lock orders it against this slice (the later plan-lock takes the
# next free number and rebases).
# PLAN-LOCKED 22:35Z (stamp 01M41YFQDEASSA54AM6HTA2V0M), released at 01-audit-read's merge
# (cb148c4) rather than both w1 merges, once development-agent was free (mission 02 NOTES 22:35Z).
# The impact analysis was re-checked against the merged main: link/ and AuditLog unchanged since
# 646512e; AuditTrail.PAGE names its columns, so V4's audit_log columns cannot reach GET /api/audit.
# The worktree starts from main 583278c, which has audit-read but not V3. V4 touches no click
# table, so the design's target("3") comparisons hold on it. The handed-off candidate descends from
# 02-click-retention's MERGE COMMIT on main (rebase after it, confirm V4 is the next number,
# re-run check); if done first, the builder exits waiting on click-retention's live frontier. The
# integrator checks git merge-base --is-ancestor. Built by development-agent (routed from dev2).
# Launch on rig/workflows/urlshort-slice-delegated-b.workflow.yaml (QA qa2-agent, review
# review2-agent), so w2's two slices do not queue on one judge; qa2-agent is this slice's proof judge.
proofPolicy:
  judges:
    - qa2-agent@urlshort-factory
territory:
  - src/main/java/dev/urlshort/link/
  - src/test/java/dev/urlshort/link/
  - src/functionalTest/java/dev/urlshort/link/
  - src/main/java/dev/urlshort/audit/
  - src/test/java/dev/urlshort/audit/
  - src/functionalTest/java/dev/urlshort/audit/
  - src/main/resources/db/migration/
  # TEST-SIDE GRANT (lead, 2026-10-03T23:12Z, development-agent request qitem-20261003231052-c29e30a9):
  # two of 02-click-retention's merged tests treat "the latest migration" as V3, so V4 breaks them by
  # construction. Pin each to V3, the version it is about, with no assertion changed:
  # ClickAuditColumnsTest's second migrate gains .target("3"); ClickRetentionStartupJourneyTest's
  # AC13_AC16 start(...) gains "--spring.flyway.target=3". Checked before granting: after start that
  # test only reads rows and sends one redirect (no link create or retire), so V4's link stamp never
  # runs against the V3 schema. V4's own upgrade is proven by LinkUpgradeJourneyTest and
  # LinkAuditColumnsTest.
  - src/test/java/dev/urlshort/click/ClickAuditColumnsTest.java
  - src/functionalTest/java/dev/urlshort/click/ClickRetentionStartupJourneyTest.java
# NOT in territory: click/ (02-click-retention's), web/, docs/api/openapi.json (no contract change).
execution:
  actor_role: requirements
  depends_on: [01-audit-read, 02-click-retention]
