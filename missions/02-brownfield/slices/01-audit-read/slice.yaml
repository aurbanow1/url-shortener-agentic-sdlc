metadata:
  id: 01-audit-read
# Moved from mission 01-greenfield-core (there: 04-audit-read, wave w3) by the human's fast-plan
# decision of 2026-10-03 (operator packet qitem-20261003052736-7830d02a). It is mission 02's
# brownfield enhancement slice: an impact analysis over the shipped audit_log table and the
# shipped request path precedes its design (docs/guidance/brownfield.md). Mission 02's own
# decompose step re-reads this manifest; the territory below is the mission-01 prediction.
# Gate tier decides the workflow variant: high -> urlshort-slice (human plan-lock),
# low -> urlshort-slice-delegated (orchestration lead approves the plan-lock).
tier: low
tier_reason: delegated plan-lock by the human's fast-plan decision of 2026-10-03, which delegates every slice plan-lock after 01-create-redirect in missions 01-03 to the orchestration lead (D11 since extends it to all slice plan-locks). The lead's own plan review weighs what the decomposition guide calls high, a read endpoint over the audit trail (request ids, before/after payloads) that must be loopback-only by default (NFR-S6), and the likely index migration for pagination (01-create-redirect's design left "the audit-read slice adds the index its pagination needs"; NFR-X2 rollback applies); the independent design and security reviews cover both. Reads the audit_log table shipped by mission 01.
# Requirements allocated (docs/REQUIREMENTS.md): FR-17; NFR-S6; FR-13 (impact analysis, as on every
# brownfield slice); NFR-X2 if the pagination index is a migration; cross-cutting M1 M2 M3 O1 O2.
# Mission 02 decompose (2026-10-03): wave w1 with 02-click-retention. ORDERED CUSTODY of two shared
# items: this slice holds src/main/resources/application.properties and the next Flyway version
# number FIRST; 02-click-retention takes them from this slice's merge and rebases onto it. This slice
# merges on its own verdicts without waiting for 02. It is the only w1 holder of
# docs/api/openapi.json. w1 launches only after mission 01's 03-operate is integrated (03-operate
# holds application.properties and openapi.json until then), so the impact analysis reads a main
# that holds every mission-01 change.
# Prerequisite: mission 01 shipped (the audit_log table and its row shape from 01-create-redirect).
# A cross-mission prerequisite is not a sibling edge, so execution.depends_on stays empty and the
# mission-level depends_on (02-brownfield -> 01-greenfield-core) carries it.
territory:
  # read side: the query and endpoint over audit_log; the write side is on main since mission 01.
  - src/main/java/dev/urlshort/audit/
  - src/test/java/dev/urlshort/audit/
  - src/functionalTest/java/dev/urlshort/audit/
  # the audit endpoint's entry if the design exposes it as a public API path.
  - docs/api/openapi.json
  # Plan-lock 2026-10-03T18:30Z: NOT used. The design needs no index (the primary key serves the
  # keyset walk, probe P5) and takes no Flyway number; 02-click-retention takes V3. Kept listed only
  # so the territory history stays readable; the builder adds no migration.
  - src/main/resources/db/migration/
  # ORDERED GRANT, first w1 holder: one setting, server.forward-headers-strategy=none (design §1,
  # ADR-0019). 02-click-retention holds the file after this slice's merge.
  - src/main/resources/application.properties
  # GRANT at plan-lock (lead, 2026-10-03T18:30Z, design §9 request): one line in the README endpoint
  # list, GET /api/audit marked loopback only. ORDERED, first holder; 02-click-retention's own README
  # line rebases onto this slice's merge.
  - README.md
  # TEST-SIDE GRANT (lead, 2026-10-03T18:30Z, development-agent request qitem-20261003182833-40a842ff):
  # two enumerating assertions only. "/api/audit" joins the exact path list in
  # AC28_liveDocumentDescribesTheSlice, and the operation count becomes 7 ("..., statistics, audit") in
  # AC20_everyOperationDocumentsTheTooManyRequestsProblem. No other assertion changes. AC-19 requires the
  # document to gain the operation, so these two must change by construction (same pattern as
  # 02-analytics' one-line grant on this file in mission 01). Plan-lock reading of AC-17: every
  # behavioural test of the f6dd29e suite passes unchanged; these two document-enumeration assertions
  # are the named, granted exception. 03-dogfood-fix (w2) touches this file later, after w1 merges.
  - src/functionalTest/java/dev/urlshort/web/OpenApiDocumentTest.java
