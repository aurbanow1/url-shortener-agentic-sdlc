// Design probe for 01-audit-read (design.md section 12 names what each case proves).
// Run from the repo root, no product, test or build file changes:
//   scripts/gw --log missions/02-brownfield/slices/01-audit-read/design-probe/output.txt \
//       --offline -I missions/02-brownfield/slices/01-audit-read/design-probe/audit-probe.gradle designAuditProbe
// One JavaExec task on the functional runtime classpath (shipped main code and resources, the functional
// profile overlay with its in-memory H2).
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def functional = project.sourceSets.functionalTest
    project.tasks.register('designAuditProbe', JavaExec) {
        dependsOn project.tasks.named('functionalTestClasses')
        javaLauncher.set(project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
        classpath = functional.runtimeClasspath
        mainClass = project.file('missions/02-brownfield/slices/01-audit-read/design-probe/AuditProbe.java').absolutePath
        systemProperty 'spring.profiles.active', 'functional'
    }
}
