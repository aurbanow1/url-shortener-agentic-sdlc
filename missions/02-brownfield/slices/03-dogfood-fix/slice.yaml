metadata:
  id: 03-dogfood-fix
# Gate tier decides the workflow variant: high -> urlshort-slice, low -> urlshort-slice-delegated.
# Since D11 both route the slice plan-lock to the orchestration lead.
tier: low
tier_reason: delegated plan-lock by the human's fast-plan decision of 2026-10-03 (operator packet qitem-20261003052736-7830d02a; D11 since extends it to all slice plan-locks). A bug fix with a regression test written first on shipped code, scoped by the defect report. The lead's plan review re-weighs the tier once the defect is known; if the fix touches a security-relevant surface or the schema, that is named at plan-lock.
# Requirements allocated (docs/REQUIREMENTS.md): FR-14 (the defect fixed with a regression test
# written first), FR-15 (test and documentation improvements the fix touches: GAPS.md rows closed
# or re-justified, README / docs/DESIGN.md matching the shipped behaviour), FR-13 (impact analysis,
# as on every brownfield slice); NFR-X2 if the fix needs a migration; cross-cutting M1 M2.
# EXTERNAL DEPENDENCY (not a sibling edge): the defect comes from the dogfood pass QA runs at
# mission 01's release_prep. This slice's requirements step reads that report; if the report is not
# there yet, the requirements agent exits waiting blocked on mission 01's release_prep packet.
# If no real defect surfaces, a defect is SEEDED and disclosed as seeded in
# docs/scenarios/brownfield.md (mission SPEC, D7 inputs). The seeder is the release agent: not the
# orchestration lead (who plan-locks and merges this slice) and not the QA seat that judges it.
# BROWNFIELD: design writes impact-analysis.md over the code the defect touches before design.md.
# TERRITORY: not predictable before the defect is known, so it is set at the requirements step
# from the defect report and adopted with rig workflow revise (the receipt goes in
# docs/evidence/02-brownfield/). It runs in wave w2 beside 04-audit-columns and 05-ci-cd, whose
# territories are disjoint from web/ and docs/api/openapi.json.
# WAVE MAP v5 (19:50Z): requirements and design start during w1 builds; the lead holds the
# plan-lock gate until 01-audit-read is merged (it regenerates docs/api/openapi.json and changes
# OpenApiDocumentTest), not until both w1 merges: the design's narrowed territory shares nothing with
# 02-click-retention (no click/, db/migration/ or application.properties; README checked, no change
# expected). The plan-lock requires impact-analysis.md re-checked against the merged main. The
# worktree is created at plan-lock, from the merged main. web/RateLimitFilter.java and its unit
# test are granted to mission 03's 01-analytics-v2 (c78500e): leave them out of this territory.
# TERRITORY ADOPTED (lead, 2026-10-03T19:00Z, from SPEC fb489a9 Non-functional > Territory; defect
# W2-01, with W2-03 accepted in passing, which closes GAPS QA-OPR-02).
# NARROWED (lead, 19:50Z) to the design's section 9 (design 0982cb5, review PASS 6e17587): W2-03
# takes the new web/MetricsConfig and its unit test; Problems.java and application.properties are
# dropped (no property drops only the tag).
# ORDERED: openapi.json and OpenApiDocumentTest after 01-audit-read. PLAN-LOCKED 20:01Z on the
# human's "run waiting tasks" request (qitem-20261003195848-e81fcf67): the worktree is STACKED on
# slice/01-audit-read at 35590f0 (its QA-passed candidate, in review), so AC-2's audit-read 400 and
# the regenerated document hold while building. The handed-off candidate descends from
# 01-audit-read's MERGE COMMIT on main (rebase after that merge, regenerate openapi.json, re-run
# check); if done first, the builder exits waiting on audit-read's frontier. The integrator checks
# git merge-base --is-ancestor. README.md is checked, with no change expected.
# CROSS-MISSION: docs/api/openapi.json is also regenerated by mission 03's 01-analytics-v2, whose
# plan-lock waits for both w1 merges, so this slice is plan-locked first and analytics-v2 rebases
# onto this slice's merge and regenerates the document.
# docs/DESIGN.md is NOT in the build territory: the design step updates it on main, as every
# slice's design has done; the builder flags any later drift to the lead.
territory:
  - src/main/java/dev/urlshort/web/OpenApiConfig.java
  - src/main/java/dev/urlshort/web/MetricsConfig.java
  - src/test/java/dev/urlshort/web/MetricsConfigTest.java
  # additions only (design section 7)
  - src/functionalTest/java/dev/urlshort/web/OpenApiDocumentTest.java
  - src/functionalTest/java/dev/urlshort/web/HealthMetricsJourneyTest.java
  - docs/api/openapi.json
  - README.md
execution:
  actor_role: requirements
  depends_on: []
