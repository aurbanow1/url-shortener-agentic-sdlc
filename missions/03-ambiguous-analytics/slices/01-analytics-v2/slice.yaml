schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 01-analytics-v2
# Gate tier decides the workflow variant: high -> urlshort-slice, low -> urlshort-slice-delegated.
# Since human decision D11 (2026-10-03) both variants route the slice plan-lock to the
# orchestration lead; the human keeps mission plan-locks, ambiguity decisions and ship sign-offs.
tier: high
tier_reason: ambiguous scope by design (docs/guidance/decomposition.md section 4) - the mission exists to turn "marketing says the analytics are not good enough" into decided requirements, and the answer may add a migration (a new aggregate or a retention change on the click table) and changes what the privacy-sensitive client hash may be used for (NFR-P1, P2). The human's checkpoint for this slice is the ambiguity park at its requirements step, where the product decision actually sits (FR-16 requires every open question to be decided, assumed or parked on the human before anything is built); the slice plan-lock handler is the orchestration lead by D11.
# Requirements allocated (docs/REQUIREMENTS.md section 5, mission 03): FR-16, FR-8 (v2);
# NFR-P2 (retention, revisited), NFR-O3 (new metrics), NFR-L1 (only if the redirect path changes);
# cross-cutting M1 M2 M3 O1 O2.
# The shipped v1 to improve on: missions/01-greenfield-core/slices/02-analytics (click events,
# per-link totals, per-day counts, top referrers, privacy-safe daily-salted hashing; merged as
# 091ff46; ADR-0011..0013).
# DECISION FIRST: the requirements step writes the ambiguity log (what is counted: raw vs unique,
# bots; retention; privacy: what the hashed address may be used for; who reads it: API, report,
# dashboard; time zones) with options, a recommended default and the consequence of each, and
# parks it on human@kernel (rig queue block ... --on human@kernel). Nothing is designed or built
# before the decision is recorded.
# RE-PLAN AFTER THE DECISION: the decision lands before this slice's plan-lock, so a SPEC change is
# the normal requirements loop. If the decided scope needs more than one buildable outcome, the
# lead adds slices (rig scope slice create + rig workflow revise + a new wave-map version) and
# records the receipt in docs/evidence/03-ambiguous-analytics/ (decomposition.md section 7).
# CROSS-MISSION COUPLING (mission 02): mission 02 builds the NFR-P2 90-day purge on click/
# (it was not delivered in mission 01). If both missions build at once they share click/ and the
# next Flyway version number. Default: this slice's plan-lock checks main's migration head and any
# in-flight mission-02 territory; the later plan-lock takes the next free V number and the later
# implement rebases onto main. If the human's retention answer here changes NFR-P2, it feeds
# mission 02's purge if that is not yet built.
# BROWNFIELD: the slice changes shipped code (click/, merged 091ff46), so its design step writes
# impact-analysis.md over v1 (02-analytics design.md, ADR-0011..0013) before design.md
# (docs/guidance/brownfield.md); the territory below is then confirmed or extended by grant.
# Territory is a prediction (the decision is not made yet); design may request a grant.
territory:
  - src/main/java/dev/urlshort/click/
  - src/test/java/dev/urlshort/click/
  - src/functionalTest/java/dev/urlshort/click/
  # Only if the decision adds or changes stored data (V3 or later; the number is set at plan-lock).
  - src/main/resources/db/migration/
  # The statistics operation changes if the decided figures change the response.
  - docs/api/openapi.json
  - docs/diagrams/erd.mmd
  # Only if the decision needs an operator setting (for example a retention period).
  - src/main/resources/application.properties
  # DESIGN-TIME GRANT (lead, 2026-10-03T18:36Z, design-agent request of 18:31Z; SPEC A-7, rule 6):
  # uniques count the client the limiter already resolves under ADR-0015 (clientOf), so one rule and
  # one operator setting govern both. Additive only: clientOf becomes public, a public constant
  # CLIENT_ATTRIBUTE is added, and the filter sets that request attribute before it charges the
  # budget. The limiter's decisions do not change, and every existing RateLimitFilterTest case
  # passes unchanged (new cases may be added). getRemoteAddr is never rewritten, so the audit
  # read's loopback check (ADR-0019) is untouched. ClickRecorder falls back to getRemoteAddr when
  # the attribute is absent. No other web/ file. Holders: none in flight (mission 01's 03-operate
  # is merged); mission 02's 03-dogfood-fix (W2-01, W2-03) sets its web/ territory at its
  # requirements step and must leave these two files out, or the later plan-lock orders custody.
  - src/main/java/dev/urlshort/web/RateLimitFilter.java
  - src/test/java/dev/urlshort/web/RateLimitFilterTest.java
  # TEST-SIDE GRANT (lead, 2026-10-03T21:57Z, dev2-agent request qitem-20261003215452-d915f3ab, found
  # by a trial rebase onto 01-audit-read's merge cb148c4): one expected body in
  # AuditUpgradeJourneyTest.AC18_anExistingDatabaseUpgradesInPlaceAndKeepsItsLinksAndRows (lines
  # 54-56 at cb148c4), whose single clicksPerDay element gains "uniqueVisitors":1,"botClicks":0.
  # Nothing else in the test changes. It is the same exact-shape update AC-14 allows for
  # StatsJourneyTest and ClickRecordingJourneyTest; the impact analysis could not name it because the
  # test did not exist on main. Named in PROOF.md as an AC-14 shape update. Applied in the final
  # rebase onto main. CUSTODY: mission 02's 04-audit-columns also holds src/functionalTest/.../audit/;
  # whichever of the two merges second rebases onto the other's merge.
  - src/functionalTest/java/dev/urlshort/audit/AuditUpgradeJourneyTest.java
# AC-14 READING (lead, 2026-10-03T23:30Z, qa-agent question qitem-20261003232953-089d2fd3): AC-14 holds
# this slice to the f6dd29e functional suite. Replayed literally on ec466da, 153/155 pass; the two
# failures are OpenApiDocumentTest's path list (AC28_liveDocumentDescribesTheSlice, "/api/audit") and
# operation count (AC20_..., 7). Mission 02's 01-audit-read made both by its own AC-19 under the
# lead's grant 428e9e1 and merged them (cb148c4); this slice adds no path or operation and does not
# touch that test, and main's two updated assertions pass on ec466da. So the audit-read grant carries
# forward: these two enumerations are excused under AC-14 as another merged slice's change, not this
# slice's. Every other f6dd29e assertion still binds, except the per-day shape updates AC-14 names.
# Not a GAPS.md row: nothing goes unchecked, the current assertions are stricter than the original.
# NOT in territory: link/ (the redirect hook from 02-analytics stays as it is; any change there is
# a design-time grant, as the hook was for 02), the rest of web/, audit/ (except the one granted
# test assertion above).
execution:
  actor_role: requirements
  depends_on: []
