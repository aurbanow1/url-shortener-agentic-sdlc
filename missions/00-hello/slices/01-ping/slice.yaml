schema: openrig.slice/v0alpha1
kind: slice
composition:
  mission: ../../mission.yaml
  slice_markdown:
    spec: SPEC.md
    progress: PROGRESS.md
    proof: PROOF.md
metadata:
  id: 01-ping
# Gate tier decides the workflow variant: high -> urlshort-slice (human plan-lock),
# low -> urlshort-slice-delegated (orchestration lead approves the plan-lock).
tier: high
tier_reason: dry run of the full pipeline including the human plan-lock gate; first slice to add a cross-cutting request-id filter (foundation)
# Territory: the ping endpoint itself plus a shared web package for the
# request-id filter (every request line must carry requestId; no filter exists
# yet, and it does not belong under ping/). Single slice in this wave, so the
# wider territory collides with nothing.
territory:
  - src/main/java/dev/urlshort/ping/
  - src/test/java/dev/urlshort/ping/
  - src/functionalTest/java/dev/urlshort/ping/
  - src/main/java/dev/urlshort/web/
  - src/test/java/dev/urlshort/web/
  - src/functionalTest/java/dev/urlshort/web/
  # Granted at design (design.md section 9): the functional suite must run under the
  # shipped ECS log format so the JSON log line is proven by effect; one-line deletion.
  - src/functionalTest/resources/application.properties
execution:
  actor_role: requirements
  depends_on: []
